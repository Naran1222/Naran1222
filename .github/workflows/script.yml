name: Daily Python Script

on:
  schedule:
    - cron: '17 5 * * *'
  
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: extracting code
        uses: actions/checkout@v4

      - name: configuring environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: installing dependancies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary gspread pandas
          
      - name: Network diagnostics for Sysadmin
        run: |
          echo "=== Поточна IP-адреса GitHub Runner ==="
          curl -s ifconfig.me
          echo -e "\n\n=== Перевірка відкритості порту 5432 ==="
          nc -vz 35.157.65.160 5432 || echo "Порт недоступний або заблокований фаєрволом"
          echo -e "\n\n=== Трасування маршруту до сервера ==="
          sudo apt-get install -y traceroute
          traceroute 35.157.65.160

      - name: running script
        env:
          ETL_SHEETS_BOT_CD: ${{ secrets.ETL_SHEETS_BOT_CD }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PORT: ${{ secrets.PORT }}
          SERVER_NAME: ${{ secrets.SERVER_NAME }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: |
          python daily-CRM_pipeline.py
          python daily-VIP_pipeline.py
          python daily-SUPERVIP_pipeline.py